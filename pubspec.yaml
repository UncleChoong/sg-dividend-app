name: sg_dividend
description: APY — Singapore dividend yield optimizer.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/bundled_universe.json

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icon_source.png"
  remove_alpha_ios: true
